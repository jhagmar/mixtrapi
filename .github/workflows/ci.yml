name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caecaeb52321d32bb4b6a5bc1f85c # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Layering
        run: npm run layering
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Conformance
        run: npm run conformance
      - name: Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8d63d554 # v5.4.3
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
