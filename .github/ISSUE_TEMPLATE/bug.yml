name: Bug
description: Report a defect in the spec, schemas, or JavaScript helpers
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: git SHA or npm version
    validations:
      required: true
